name: build

on:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  pull-requests: read

# Superseded runs of a branch are cancelled; push and pull_request runs never share a group
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pr:
    name: Open pull request
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length)
          echo "exists=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: pr
    # A push to a branch with an open pull request is built by the pull_request run of that commit
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.pr.outputs.exists != 'true') }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        polyml: ['5.7.1', '5.9.2']
        hol4: ['trindemossen-2']

    env:
      POLYML_VERSION: ${{ matrix.polyml }}
      HOL4_VERSION: ${{ matrix.hol4 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/scripts/HOL
          key: os-${{ runner.os }}_polyml-${{ matrix.polyml }}_hol4-${{ matrix.hol4 }}

      - name: Prepare cached dependencies
        timeout-minutes: 45
        run: |
          cd scripts && ./install.sh

      - name: Export Ott files to HOL4 and run Holmake
        run: eval "$(opam env)" && export PATH=$PATH:$GITHUB_WORKSPACE/scripts/HOL/bin && make hol
        
      - name: Compile tests of the base theories
        run: export PATH=$PATH:$GITHUB_WORKSPACE/scripts/HOL/bin && make hol_tests

      - name: Compile metatheory
        run: export PATH=$PATH:$GITHUB_WORKSPACE/scripts/HOL/bin && make metatheory

      - name: Compile symbolic execution tests
        run: export PATH=$PATH:$GITHUB_WORKSPACE/scripts/HOL/bin && make symb_exec_tests
